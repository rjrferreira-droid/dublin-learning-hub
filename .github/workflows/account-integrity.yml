name: Account identity and browser integrity
on:
  push:
    branches: [fix/core-consolidation-2026-09-13]
    paths:
      - '.github/workflows/account-integrity.yml'
      - 'scripts/prepare-account-integrity.mjs'
      - 'src/auth/**'
      - 'src/professor/livekitProfessor.ts'
      - 'tests/account-boundary.spec.ts'
      - 'tests/account-contract.test.ts'
      - 'tests/helpers/auth-fixture.ts'
permissions:
  contents: write
jobs:
  account-bound-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VITE_SUPABASE_URL: https://lh-ui.invalid
      VITE_SUPABASE_PUBLISHABLE_KEY: fictional-browser-fixture-not-a-key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Apply exact account-bound source repairs in isolated branch
        run: node scripts/prepare-account-integrity.mjs
      - name: Verify account contracts and previous core contracts without provider calls
        run: node --experimental-strip-types --test tests/account-contract.test.ts tests/reservation-exposure.test.ts tests/callback-delivery.test.ts tests/legacy-session-boundary.test.ts tests/runtime-inventory.test.ts tests/completion-contract.test.ts tests/professor-start.test.ts
      - name: Build application/API from locked dependencies
        run: npm ci && npm run build
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Execute browser account, navigation and cancellation scenarios with fictional Auth/REST
        run: npx playwright test tests/account-boundary.spec.ts tests/smoke.spec.ts --grep-invert 'authenticated Learning Hub shell' --retries=0
      - name: Check unchanged voice worker types
        run: npm --prefix professor-agent ci && npm --prefix professor-agent run typecheck
      - name: Confirm Manuzinha source was not modified
        run: git diff --exit-code -- src/components/LittleEnglish.tsx src/little-english.css
      - name: Commit only verified account-bound changes to the repair branch
        run: |
          test "$GITHUB_REF_NAME" = "fix/core-consolidation-2026-09-13"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/components/AuthGate.tsx src/App.tsx src/services/learningMemory.ts src/components/ProfessorSessionPanel.tsx api/livekit-token.ts tests/smoke.spec.ts
          if ! git diff --cached --quiet; then
            git commit -m 'Apply browser-verified account identity and connection cleanup'
            git push origin HEAD:fix/core-consolidation-2026-09-13
          fi
      - name: Record acceptance boundary
        run: echo 'Auth and REST are fictional. This does not prove live Supabase credentials, RLS, voice quality, production readiness or full historical reconstruction. No live deployment performed.'
