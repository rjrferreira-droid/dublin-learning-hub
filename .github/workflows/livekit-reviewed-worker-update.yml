name: Reviewed V2 worker update
# No publication on push/PR. Future updates require explicit confirmation and a verified current version.
on:
  workflow_dispatch:
    inputs:
      confirm_update:
        description: 'Authorize this reviewed revision to update the existing V2 worker only, without changing secrets or creating a session.'
        type: boolean
        required: true
        default: false
      expected_current_version:
        description: 'Exact currently deployed LiveKit version verified before this update.'
        type: string
        required: true
permissions:
  contents: read
concurrency:
  group: learning-hub-professor-v2
  cancel-in-progress: false
jobs:
  verify-and-update-existing-worker:
    if: github.event_name == 'workflow_dispatch' && inputs.confirm_update && github.repository == 'rjrferreira-droid/dublin-learning-hub' && github.ref == 'refs/heads/fix/core-consolidation-2026-09-13'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify the patched worker and high/critical audit before credentials are available
        run: |
          npm --prefix professor-agent ci
          npm --prefix professor-agent audit --audit-level=high
          npm --prefix professor-agent run typecheck
          python3 -m py_compile scripts/livekit-reviewed-publish.py
      - name: Build the worker container and check native module without network or provider access
        run: |
          docker build --pull --tag lh-professor-verified:${{ github.sha }} professor-agent
          test "$(docker image inspect --format '{{.Config.User}}' lh-professor-verified:${{ github.sha }})" = 'node'
          docker run --rm --network none lh-professor-verified:${{ github.sha }} npm run typecheck
          docker run --rm --network none lh-professor-verified:${{ github.sha }} node --input-type=module -e "import {createRequire} from 'node:module';const r=createRequire(import.meta.resolve('@livekit/agents'));const s=r('sharp');if(s.versions.sharp!=='0.35.4')throw Error('Patch missing');await import('@livekit/agents-plugin-openai');console.log('Patched library and SDK imports verified');"
          git diff --exit-code
      - name: Install pinned official CLI before providing credentials
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/lh-livekit-cli"
          cd "$RUNNER_TEMP/lh-livekit-cli"
          curl --fail --silent --show-error --location --proto '=https' --proto-redir '=https' --max-time 90 --output lk.tar.gz https://github.com/livekit/livekit-cli/releases/download/v2.18.6/lk_2.18.6_linux_amd64.tar.gz
          echo 'fa6441e315376a64fcfa173c64ee6c9dcf8bd25d40320aa99b690045832980fe  lk.tar.gz' | sha256sum --check
          tar -xzf lk.tar.gz lk
          chmod 755 lk
          echo "$RUNNER_TEMP/lh-livekit-cli" >> "$GITHUB_PATH"
      - name: Publish once only if the existing version still matches the reviewed target
        env:
          LH_REVIEWED_UPDATE_AUTHORIZED: '1'
          LH_EXPECTED_PREVIOUS: ${{ inputs.expected_current_version }}
          LIVEKIT_URL: ${{ secrets.LIVEKIT_URL }}
          LIVEKIT_API_KEY: ${{ secrets.LIVEKIT_API_KEY }}
          LIVEKIT_API_SECRET: ${{ secrets.LIVEKIT_API_SECRET }}
        run: python3 scripts/livekit-reviewed-publish.py
      - name: Confirm no tracked source/config was rewritten
        if: always()
        run: git diff --exit-code
