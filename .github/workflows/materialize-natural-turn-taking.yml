name: Materialize natural turn-taking candidate
on:
  push:
    branches: [feat/professor-experience-2026-09-13]
    paths:
      - '.github/workflows/materialize-natural-turn-taking.yml'
      - 'scripts/materialize-natural-turn-taking.mjs'
      - 'tests/professor-turn-taking.test.ts'
permissions:
  contents: write
jobs:
  materialize:
    if: github.ref == 'refs/heads/feat/professor-experience-2026-09-13'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      VITE_SUPABASE_URL: https://lh-ui.invalid
      VITE_SUPABASE_PUBLISHABLE_KEY: fictional-turn-taking-fixture-not-a-key
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Apply exact branch-scoped patch in this checkout
        run: node scripts/materialize-natural-turn-taking.mjs
      - name: Compile worker and run all non-browser contracts before source is persisted
        run: |
          npm ci
          npm --prefix professor-agent ci
          npm --prefix professor-agent run typecheck
          node --experimental-strip-types --test tests/*.test.ts
      - name: Prove the patch is only the intended worker entrypoint change
        run: |
          git diff --exit-code -- ':!professor-agent/src/index.ts'
          git diff --check -- professor-agent/src/index.ts
      - name: Commit only the tested entrypoint source to the feature branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add professor-agent/src/index.ts
          if ! git diff --cached --quiet; then
            git commit -m 'Limit deterministic mid-turn cut-ins to explicit oral mocks'
            git push origin HEAD:feat/professor-experience-2026-09-13
          fi
      - name: Boundary
        run: echo 'Source candidate only. No LiveKit credentials, deploy, microphone, model call or V2 cutover.' >> "$GITHUB_STEP_SUMMARY"
