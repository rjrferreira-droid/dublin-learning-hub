name: Parallel Professor experience and pedagogy checks
on:
  push:
    branches: [feat/professor-experience-2026-09-13]
permissions:
  contents: read
jobs:
  companion-and-quality:
    if: github.ref == 'refs/heads/feat/professor-experience-2026-09-13'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VITE_SUPABASE_URL: https://lh-ui.invalid
      VITE_SUPABASE_PUBLISHABLE_KEY: fictional-companion-fixture-not-a-key
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Preserve published worker, database, account gate and standalone child portal
        run: git diff --exit-code 3d292fe7f913135fd4b461487cc5dffde74bc7e1 HEAD -- professor-agent supabase src/auth src/components/AuthGate.tsx src/components/LittleEnglish.tsx src/little-english.css src/professor/voiceState.ts
      - name: Install locked dependencies and build committed candidate
        run: npm ci && npm run build
      - name: Compare initial JavaScript with the previous candidate using identical installed dependencies
        run: |
          git worktree add --detach "$RUNNER_TEMP/lh-payload-baseline" d3818cc656f0afa820922eb7c6675a30a5dbdd7a
          ln -s "$GITHUB_WORKSPACE/node_modules" "$RUNNER_TEMP/lh-payload-baseline/node_modules"
          (cd "$RUNNER_TEMP/lh-payload-baseline" && "$GITHUB_WORKSPACE/node_modules/.bin/vite" build --manifest --outDir "$RUNNER_TEMP/lh-baseline-dist")
          node scripts/bundle-metrics.mjs "$RUNNER_TEMP/lh-baseline-dist"
      - name: Preparation, outcome, cancellation and existing contracts
        run: node --experimental-strip-types --test tests/*.test.ts
      - name: Bundle handler and unchanged evaluator for mocked integration
        run: |
          npx --no-install esbuild api/livekit-token.ts --bundle --platform=node --format=esm --packages=external --outfile=.test-runtime/written-bridge-api.mjs
          npx --no-install esbuild professor-agent/src/evaluation.ts --bundle --platform=node --format=esm --packages=external --outfile=.test-runtime/written-bridge-evaluator.mjs
      - name: Actual request assembly with fictional services only
        run: node --experimental-test-module-mocks --test tests/written-bridge.integration.mjs
      - run: npx playwright install --with-deps chromium
      - name: UI, study, preparation, simulated media and saved-feedback regressions
        run: npx playwright test --grep-invert 'authenticated Learning Hub shell' --retries=0
      - name: Production-build lazy loading and recovery without starting voice
        run: npx playwright test --config playwright.production.config.ts
      - name: Require screenshot evidence as well as payload metrics
        run: |
          test "$(find test-results -name 'experience-*.png' | wc -l)" -ge 4
          test "$(find test-results -name 'mobile-reading-*.png' | wc -l)" -ge 3
          test -s quality-results/bundle-metrics.json
      - name: Keep only authored content, explicitly fictional feedback and aggregate bundle measurements
        uses: actions/upload-artifact@v4
        with:
          name: autonomous-experience-evidence
          path: |
            test-results/**/experience-*.png
            test-results/**/mobile-reading-*.png
            quality-results/bundle-metrics.json
          retention-days: 7
          if-no-files-found: error
      - name: Unchanged committed source and release boundary
        run: |
          git diff --exit-code
          echo 'No source patch/commit, real account credentials, model/voice calls, database writes, worker deployment, course expansion or spending-limit change. Media/evaluator responses are simulated. This workflow stops after verification.' >> "$GITHUB_STEP_SUMMARY"
