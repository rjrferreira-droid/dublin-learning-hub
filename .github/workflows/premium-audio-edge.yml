name: Premium Audio Edge dependency preparation
on:
  push:
    branches: [feat/professor-experience-2026-09-13]
    paths:
      - 'supabase/functions/premium-lesson-audio/**'
      - 'server/p1-written-lesson-context.ts'
      - 'tests/p1-edge-context-smoke.ts'
      - '.github/workflows/premium-audio-edge.yml'
permissions:
  contents: read
jobs:
  dependencies:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.6
      - name: Check complete Edge graph against the generated lock
        run: deno check --frozen --config supabase/functions/premium-lesson-audio/deno.json supabase/functions/premium-lesson-audio/index.ts
      - name: Preserve committed dependency lock
        run: git diff --exit-code
      - name: Execute authored context in the real Edge JavaScript runtime
        run: deno run --frozen --config supabase/functions/premium-lesson-audio/deno.json tests/p1-edge-context-smoke.ts
