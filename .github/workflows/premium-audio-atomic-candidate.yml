          psql -v ON_ERROR_STOP=1 -c "delete from lh_internal.premium_audio_attempts where id='55555555-5555-4555-8555-555555555555'"
          psql -v ON_ERROR_STOP=1 -f "$audio_v3_candidate"
          python3 quality/tests/premium-audio-service-access-v3.py
          python3 quality/tests/premium-audio-golden-v3.py
          # The following legacy stop rehearsal predates closed v2 admission
