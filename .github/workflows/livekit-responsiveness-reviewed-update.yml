name: Reviewed Professor responsiveness update
on:
  push:
    branches: [feat/professor-experience-2026-09-13]
    paths:
      - '.github/workflows/livekit-responsiveness-reviewed-update.yml'
      - 'quality/candidates/professor-responsiveness-2026-09-21.patch'
      - 'scripts/prepare-professor-responsiveness.py'
      - 'scripts/livekit-responsiveness-publish.py'
      - 'tests/professor-responsiveness.test.ts'
  workflow_dispatch:
    inputs:
      confirm_update:
        description: 'Publish the reviewed conversation fixes to the existing V2 Professor; no new session or secret changes.'
        type: boolean
        required: true
        default: false
      expected_current_version:
        description: 'Verified current LiveKit version (this release accepts nb67ioJmoKBN only).'
        type: string
        required: true
permissions:
  contents: read
concurrency:
  group: learning-hub-professor-v2
  cancel-in-progress: false
jobs:
  reviewed-release:
    if: github.repository == 'rjrferreira-droid/dublin-learning-hub' && github.ref == 'refs/heads/feat/professor-experience-2026-09-13'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Prepare the exact published worker with the reviewed patch only
        run: |
          python3 scripts/prepare-professor-responsiveness.py "$RUNNER_TEMP/lh-responsive-release"
          python3 -m py_compile scripts/livekit-responsiveness-publish.py
          npm ci
          LH_RESPONSIVENESS_ENTRY="$RUNNER_TEMP/lh-responsive-release/professor-agent/src/index.ts" node --experimental-strip-types --test tests/professor-responsiveness.test.ts
          npm --prefix "$RUNNER_TEMP/lh-responsive-release/professor-agent" ci
          npm --prefix "$RUNNER_TEMP/lh-responsive-release/professor-agent" audit --audit-level=high
          npm --prefix "$RUNNER_TEMP/lh-responsive-release/professor-agent" run typecheck
      - name: Verify the exact container offline before publication credentials
        run: |
          docker build --pull --tag lh-responsive:${{ github.sha }} "$RUNNER_TEMP/lh-responsive-release/professor-agent"
          test "$(docker image inspect --format '{{.Config.User}}' lh-responsive:${{ github.sha }})" = 'node'
          docker run --rm --network none lh-responsive:${{ github.sha }} npm run typecheck
          docker run --rm --network none lh-responsive:${{ github.sha }} node --input-type=module -e "import {createRequire} from 'node:module';const r=createRequire(import.meta.resolve('@livekit/agents'));if(r('sharp').versions.sharp!=='0.35.4')throw Error('Patch missing');await import('@livekit/agents-plugin-openai');"
          git diff --exit-code
      - name: Install official pinned CLI for explicitly requested publication only
        if: github.event_name == 'workflow_dispatch' && inputs.confirm_update
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/lh-livekit-cli"
          cd "$RUNNER_TEMP/lh-livekit-cli"
          curl --fail --silent --show-error --location --proto '=https' --proto-redir '=https' --max-time 90 --output lk.tar.gz https://github.com/livekit/livekit-cli/releases/download/v2.18.6/lk_2.18.6_linux_amd64.tar.gz
          echo 'fa6441e315376a64fcfa173c64ee6c9dcf8bd25d40320aa99b690045832980fe  lk.tar.gz' | sha256sum --check
          tar -xzf lk.tar.gz lk
          chmod 755 lk
          echo "$RUNNER_TEMP/lh-livekit-cli" >> "$GITHUB_PATH"
      - name: Publish once to the verified existing V2 agent
        if: github.event_name == 'workflow_dispatch' && inputs.confirm_update
        env:
          LH_RESPONSIVENESS_UPDATE_AUTHORIZED: '1'
          LH_EXPECTED_PREVIOUS: ${{ inputs.expected_current_version }}
          LIVEKIT_URL: ${{ secrets.LIVEKIT_URL }}
          LIVEKIT_API_KEY: ${{ secrets.LIVEKIT_API_KEY }}
          LIVEKIT_API_SECRET: ${{ secrets.LIVEKIT_API_SECRET }}
        run: |
          cd "$RUNNER_TEMP/lh-responsive-release"
          python3 "$GITHUB_WORKSPACE/scripts/livekit-responsiveness-publish.py"
      - name: Preserve the repository checkout
        if: always()
        run: git diff --exit-code
