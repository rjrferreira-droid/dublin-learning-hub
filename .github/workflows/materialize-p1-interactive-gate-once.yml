name: Materialize P1 interactive gate once
on:
  push:
    branches: [feat/professor-experience-2026-09-13]
    paths: [.github/workflows/materialize-p1-interactive-gate-once.yml]
permissions:
  contents: write
jobs:
  apply:
    if: github.ref == 'refs/heads/feat/professor-experience-2026-09-13'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/professor-experience-2026-09-13
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Apply fail-on-drift P1 interactive gate
        run: |
          node scripts/materialize-p1-interactive-gate.mjs
          git diff --check -- src/App.tsx
          test -n "$(git status --porcelain -- src/App.tsx)"
      - name: Commit gate and remove one-shot materializer
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/App.tsx
          git rm scripts/materialize-p1-interactive-gate.mjs .github/workflows/materialize-p1-interactive-gate-once.yml
          git commit -m 'Fail closed on P1 interactive providers until server handoff review'
          git push origin HEAD:feat/professor-experience-2026-09-13
